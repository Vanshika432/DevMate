services:
  devmate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: devmate-copilot
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - MOCK_MODE=true
      - STREAMLIT_PORT=8501
      - APP_ENV=production
    env_file:
      - .env.example
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
